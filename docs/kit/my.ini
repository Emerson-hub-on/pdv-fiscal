; my.ini do MySQL 8.4 para o Laragon 6 (cliente).
; É o arquivo que o Laragon 6 gera, sem a linha default_authentication_plugin,
; que o MySQL 8.4 não aceita. Copie para C:\laragon\bin\mysql\mysql-8.4.3-winx64\
; e deixe somente leitura (attrib +r), senão o Laragon grava a linha de volta a cada Start.

[client]
#password=your_password
port=3306
socket=/tmp/mysql.sock

[mysqld]
datadir="C:/laragon/data/mysql-8"
port=3306
socket=/tmp/mysql.sock
key_buffer_size=256M
max_allowed_packet=512M
table_open_cache=256
sort_buffer_size=1M
read_buffer_size=1M
read_rnd_buffer_size=4M
myisam_sort_buffer_size=64M
thread_cache_size=8

secure-file-priv=""
explicit_defaults_for_timestamp=1


[mysqldump]
quick
max_allowed_packet=512M
